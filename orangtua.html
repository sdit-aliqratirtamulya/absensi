<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Orang Tua - Presensi Digital SDIT AL-IQRA</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body { font-family: 'Rajdhani', sans-serif; background-color: #030712; color: #f8fafc; }
    .font-tech { font-family: 'Orbitron', sans-serif; }
    .cyber-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.2); }
    
    .id-card-potrait-exact {
      width: 53.9mm !important; height: 85.6mm !important; position: relative !important;
      background: linear-gradient(135deg, #0b1329 0%, #030712 60%, #0284c7 100%) !important;
      border: 1.5px solid rgba(56, 189, 248, 0.5) !important; border-radius: 12px !important;
      box-sizing: border-box !important; overflow: hidden !important; font-family: 'Rajdhani', sans-serif !important;
      color: #ffffff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
    }
    .id-card-potrait-exact::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(14, 165, 233, 0.15), transparent 70%); pointer-events: none;
    }
    .card-header-logos {
      position: absolute; top: 8px; left: 0; right: 0;
      display: flex; justify-content: center; align-items: center; gap: 8px; padding: 0 8px;
    }
    .card-header-logos img { height: 22px !important; width: auto; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    .card-title-box {
      position: absolute; top: 35px; left: 8px; right: 8px;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 6px; color: #38bdf8;
      font-family: 'Orbitron', sans-serif; font-size: 7px !important; font-weight: 800 !important;
      text-align: center; padding: 2.5px 0; letter-spacing: 0.8px;
    }
    .card-photo-box {
      position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
      width: 22mm; height: 27mm; border: 2px solid #38bdf8; border-radius: 8px;
      background-color: #0f172a; display: flex; align-items: center; justify-content: center;
      overflow: hidden; box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
    .card-info-box { position: absolute; top: 124px; left: 6px; right: 6px; text-align: center; }
    .card-info-box .info-group { margin-bottom: 2px; }
    .card-info-box .label { display: block; font-size: 7.5px !important; color: #94a3b8; font-weight: 700 !important; letter-spacing: 0.5px; }
    .card-info-box .value { display: block; font-size: 9.5px !important; color: #ffffff; font-family: 'Orbitron', sans-serif; font-weight: 800 !important; text-transform: uppercase; }
    .card-qr-box {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 4px; background: #ffffff; border: 1.5px solid #0284c7; border-radius: 8px;
    }
    .qr-container canvas, .qr-container img { width: 21mm !important; height: 21mm !important; }
    .card-footer-text {
      position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
      font-family: 'Orbitron', sans-serif; font-size: 7px !important; font-weight: 800 !important; color: #38bdf8; letter-spacing: 1.2px;
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

  <div class="w-full max-w-xl space-y-6">
    
    <!-- HEADER LOGO SEKOAHL & BRANDING -->
    <div class="text-center space-y-3">
      <div class="flex items-center justify-center gap-3 bg-slate-900/60 p-3 rounded-2xl border border-slate-800 w-max mx-auto shadow-lg">
        <img src="logo-karawang.png" alt="Karawang" class="h-10 w-auto object-contain">
        <img src="logo-disdik.png" alt="Disdik" class="h-10 w-auto object-contain">
        <img src="logo-sekolah.png" alt="Sekolah" class="h-10 w-auto object-contain">
      </div>
      <div>
        <h1 class="text-2xl font-tech font-bold text-cyan-400 tracking-wider">PORTAL ORANG TUA</h1>
        <p class="text-xs text-slate-400">SDIT AL-IQRA TIRTAMULYA</p>
      </div>
    </div>

    <!-- CARI NIS -->
    <div class="cyber-card p-6 rounded-2xl space-y-4">
      <label class="font-tech text-xs text-cyan-400 uppercase font-bold block">Masukan NIS Siswa</label>
      <div class="flex gap-2">
        <input type="text" id="input-nis" placeholder="Contoh: 1001" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-cyan-500">
        <button id="btn-submit-parent" onclick="cariSiswa()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-3 rounded-xl font-bold font-tech text-xs transition flex items-center justify-center gap-2">
          <i id="loading-spinner" class="fa-solid fa-circle-notch animate-spin hidden"></i>
          <span id="btn-text">CARI</span>
        </button>
      </div>
    </div>

    <!-- HASIL SISWA -->
    <div id="student-portal" class="space-y-6 hidden">
      
      <div class="cyber-card p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
          <h2 id="disp-nama" class="font-tech text-lg text-white font-bold">-</h2>
          <p class="text-xs text-slate-400">NIS: <span id="disp-nis" class="text-cyan-400">-</span> | KELAS: <span id="disp-kelas" class="text-cyan-400">-</span></p>
        </div>
        <button onclick="bukaModalKartu()" class="bg-slate-800 border border-cyan-500/50 hover:bg-slate-700 text-cyan-400 text-xs px-4 py-2 rounded-xl font-bold font-tech transition">
          <i class="fa-solid fa-id-card mr-1"></i> LIHAT KARTU
        </button>
      </div>

      <!-- FORM IZIN -->
      <div class="cyber-card p-6 rounded-2xl space-y-4">
        <h3 class="font-tech text-xs font-bold text-amber-400 uppercase"><i class="fa-solid fa-notes-medical mr-1"></i> Form Pengajuan Izin / Sakit</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Kategori Absen</label>
            <select id="izin-kategori" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl p-3 focus:outline-none focus:border-cyan-500">
              <option value="Sakit">Sakit</option>
              <option value="Izin">Izin</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Tanggal Tidak Masuk</label>
            <input type="date" id="izin-tanggal" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl p-3 focus:outline-none focus:border-cyan-500">
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 block mb-1">Alasan / Keterangan Singkat</label>
          <textarea id="izin-keterangan" rows="2" placeholder="Contoh: Demam tinggi / Ada acara keluarga" class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-xl p-3 focus:outline-none focus:border-cyan-500"></textarea>
        </div>

        <button id="btn-submit-izin" onclick="submitPengajuanIzin()" class="w-full bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-tech font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-xs">
          <i id="spinner-izin" class="fa-solid fa-circle-notch animate-spin hidden"></i>
          <span id="text-izin">KIRIM PENGAJUAN IZIN</span>
        </button>
      </div>

      <!-- RIWAYAT -->
      <div class="cyber-card p-6 rounded-2xl space-y-4">
        <h3 class="font-tech text-xs font-bold text-cyan-400 uppercase"><i class="fa-solid fa-clock-rotate-left mr-1"></i> Riwayat Absensi Terakhir</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-slate-900 text-cyan-400 uppercase font-tech">
              <tr>
                <th class="p-3">Tanggal</th>
                <th class="p-3">Waktu</th>
                <th class="p-3">Status</th>
              </tr>
            </thead>
            <tbody id="tb-riwayat" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <!-- MODAL KARTU -->
  <div id="modal-kartu" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="cyber-card p-6 rounded-2xl max-w-sm w-full space-y-4 text-center relative">
      <div class="flex justify-center">
        <div id="print-area">
          <div class="id-card-potrait-exact">
            <div class="card-header-logos">
              <img src="logo-karawang.png">
              <img src="logo-disdik.png">
              <img src="logo-sekolah.png">
            </div>
            <div class="card-title-box">SDIT AL-IQRA TIRTAMULYA</div>
            <div class="card-photo-box">
              <img id="card-photo" src="" class="w-full h-full object-cover hidden">
              <i id="card-photo-placeholder" class="fa-solid fa-user text-slate-600 text-3xl"></i>
            </div>
            <div class="card-info-box">
              <div class="info-group">
                <span class="label">NAMA:</span>
                <span class="value" id="card-name">-</span>
              </div>
              <div class="info-group">
                <span class="label">NIS:</span>
                <span class="value" id="card-nis">-</span>
              </div>
              <div class="info-group">
                <span class="label">JENIS KELAMIN:</span>
                <span class="value" id="card-jk">-</span>
              </div>
            </div>
            <div class="card-qr-box">
              <div id="card-qrcode" class="qr-container"></div>
            </div>
            <div class="card-footer-text">KARTU PRESENSI DIGITAL</div>
          </div>
        </div>
      </div>

      <button onclick="tutupModalKartu()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-tech text-xs py-2 rounded-xl">TUTUP</button>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxPDJzBTk8IDjIH6DnR00CVTkNmY3x5SmNmelyB0ZOpq6g8Lrn5HhKIOgvC3KzjAu7o/exec";
    let activeStudent = null;

    function cariSiswa() {
      const nis = document.getElementById('input-nis').value.trim();
      if (!nis) return alert("Masukan NIS terlebih dahulu!");

      const btn = document.getElementById('btn-submit-parent');
      const spinner = document.getElementById('loading-spinner');
      const btnText = document.getElementById('btn-text');

      btn.disabled = true; spinner.classList.remove('hidden'); btnText.innerText = "MECARI...";

      fetch(`${GAS_API_URL}?action=getStudentDetail&nis=${nis}`)
        .then(r => r.json())
        .then(res => {
          if (res.status === 'success') {
            activeStudent = res.data;
            document.getElementById('disp-nis').innerText = activeStudent[0];
            document.getElementById('disp-nama').innerText = activeStudent[1];
            document.getElementById('disp-kelas').innerText = activeStudent[2];
            document.getElementById('student-portal').classList.remove('hidden');

            loadRiwayat(nis);
          } else {
            alert("Data NIS tidak ditemukan!");
          }
        })
        .catch(() => alert("Terjadi kesalahan koneksi!"))
        .finally(() => {
          btn.disabled = false; spinner.classList.add('hidden'); btnText.innerText = "CARI";
        });
    }

    function loadRiwayat(nis) {
      fetch(`${GAS_API_URL}?action=getStudentHistory&nis=${nis}`)
        .then(r => r.json())
        .then(res => {
          const tbody = document.getElementById('tb-riwayat');
          tbody.innerHTML = '';
          if (res.data && res.data.length > 0) {
            res.data.forEach(row => {
              tbody.innerHTML += `
                <tr>
                  <td class="p-3">${row.tanggal}</td>
                  <td class="p-3 font-tech text-cyan-400">${row.jam}</td>
                  <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${row.status.includes('Hadir') ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">${row.status}</span></td>
                </tr>`;
            });
          } else {
            tbody.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-slate-500">Belum ada catatan presensi.</td></tr>`;
          }
        });
    }

    function submitPengajuanIzin() {
      if (!activeStudent) return;
      const kategori = document.getElementById('izin-kategori').value;
      const tanggal = document.getElementById('izin-tanggal').value;
      const keterangan = document.getElementById('izin-keterangan').value.trim();

      if (!tanggal || !keterangan) return alert("Harap isi tanggal dan alasan pengajuan!");

      const btn = document.getElementById('btn-submit-izin');
      const spinner = document.getElementById('spinner-izin');
      const text = document.getElementById('text-izin');

      btn.disabled = true; spinner.classList.remove('hidden'); text.innerText = "MENGIRIM...";

      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "submitIzinSiswa",
          nis: activeStudent[0],
          status: kategori,
          tanggal: tanggal,
          keterangan: keterangan
        })
      })
      .then(r => r.json())
      .then(res => {
        alert(res.message);
        if (res.status === 'success') {
          document.getElementById('izin-keterangan').value = '';
          document.getElementById('izin-tanggal').value = '';
          loadRiwayat(activeStudent[0]);
        }
      })
      .catch(() => alert("Terjadi kesalahan!"))
      .finally(() => {
        btn.disabled = false; spinner.classList.add('hidden'); text.innerText = "KIRIM PENGAJUAN IZIN";
      });
    }

    function bukaModalKartu() {
      if (!activeStudent) return;
      document.getElementById('card-name').innerText = activeStudent[1];
      document.getElementById('card-nis').innerText = activeStudent[0];
      document.getElementById('card-jk').innerText = activeStudent[3] || 'Laki-Laki';
      
      const fotoUrl = activeStudent[5] || '';
      const imgEl = document.getElementById('card-photo');
      const placeholderEl = document.getElementById('card-photo-placeholder');

      if (fotoUrl) {
        imgEl.src = fotoUrl; imgEl.classList.remove('hidden'); placeholderEl.classList.add('hidden');
      } else {
        imgEl.classList.add('hidden'); placeholderEl.classList.remove('hidden');
      }

      const qrBox = document.getElementById('card-qrcode');
      qrBox.innerHTML = '';
      new QRCode(qrBox, { text: activeStudent[0].toString(), width: 65, height: 65 });

      document.getElementById('modal-kartu').classList.remove('hidden');
    }

    function tutupModalKartu() { document.getElementById('modal-kartu').classList.add('hidden'); }
  </script>
</body>
</html>
