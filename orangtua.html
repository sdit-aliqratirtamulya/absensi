<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Orang Tua - SDIT AL-IQRA TIRTAMULYA</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QRCode Generator JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap');

    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #080c14;
      color: #e2e8f0;
    }

    .font-tech {
      font-family: 'Orbitron', sans-serif;
    }

    .cyber-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(6, 182, 212, 0.2);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.1);
    }

    /* KARTU PELAJAR POTRAIT PRINT STYLE */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    }

   /* KARTU PELAJAR EXACT MATCH DESIGN */
.id-card-potrait-exact {
  width: 53.9mm !important;
  height: 85.6mm !important;
  position: relative !important;
  background-image: url('bg-kartu-potrait.png') !important;
  background-size: cover !important;
  background-position: center !important;
  border-radius: 12px !important;
  overflow: hidden !important;
  box-sizing: border-box !important;
  font-family: 'Rajdhani', sans-serif !important;
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

/* 1. Header Logo (Diperbesar) */
.card-header-logos {
  position: absolute;
  top: 8px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
}

.card-header-logos img {
  height: 24px !important; /* Diperbesar dari sebelumnya 20px */
  width: auto;
  object-fit: contain;
}

/* 2. Judul Kartu (Font Diperbesar & Tebal) */
.card-title-box {
  position: absolute;
  top: 36px;
  left: 10px;
  right: 10px;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid #06b6d4;
  border-radius: 4px;
  color: #38bdf8;
  font-family: 'Orbitron', sans-serif;
  font-size: 7.5px !important; /* Diperbesar */
  font-weight: 800 !important; /* Extra Bold */
  text-align: center;
  padding: 3px 0;
  letter-spacing: 0.5px;
}

/* 3. Foto Siswa Box */
.card-photo-box {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: 20mm;
  height: 25mm;
  border: 2px solid #38bdf8;
  border-radius: 6px;
  background-color: #1e293b;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* 4. Informasi Siswa (Font Diperbesar & Serba Tebal) */
.card-info-box {
  position: absolute;
  top: 120px;
  left: 0;
  right: 0;
  text-align: center;
  color: #38bdf8;
}

.card-info-box .info-group {
  margin-bottom: 3px;
}

.card-info-box .label {
  display: block;
  font-size: 8px !important; /* Diperbesar */
  color: #38bdf8;
  font-weight: 800 !important; /* Bold */
  letter-spacing: 0.5px;
}

.card-info-box .value {
  display: block;
  font-size: 10px !important; /* Diperbesar */
  color: #ffffff;
  font-family: 'Orbitron', sans-serif;
  font-weight: 800 !important; /* Bold */
  text-transform: uppercase;
}

/* 5. QR Code Box */
.card-qr-box {
  position: absolute;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  padding: 3px;
  background: #ffffff;
  border: 2px solid #38bdf8;
  border-radius: 6px;
}

.qr-container canvas, .qr-container img {
  width: 23mm !important;
  height: 23mm !important;
}

/* 6. Footer Text (Font Diperbesar & Tebal) */
.card-footer-text {
  position: absolute;
  bottom: 7px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 7.5px !important; /* Diperbesar */
  font-weight: 800 !important; /* Extra Bold */
  color: #38bdf8;
  letter-spacing: 1px;
}
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

  <!-- HEADER BRANDING -->
  <header class="w-full max-w-xl text-center space-y-3 mb-6">
    <div class="flex items-center justify-center gap-3 bg-slate-950/60 p-3 rounded-2xl border border-slate-800">
      <img src="logo-karawang.png" alt="Karawang" class="h-10 w-auto">
      <img src="logo-disdik.png" alt="Disdik" class="h-10 w-auto">
      <img src="logo-sekolah.png" alt="Sekolah" class="h-10 w-auto">
    </div>
    <h1 class="font-tech text-xl md:text-2xl font-bold text-cyan-400 tracking-wider">PORTAL WALI MURID</h1>
    <p class="text-xs text-slate-400">Monitoring Presensi & Kartu Digital SDIT Al-Iqra Tirtamulya</p>
  </header>

  <!-- FORM LOGIN SISWA (BY NIS) -->
  <div id="login-box" class="w-full max-w-md cyber-card p-6 rounded-2xl space-y-4">
    <h2 class="font-tech text-sm font-bold text-cyan-400 text-center uppercase">Cek Data & Kartu Siswa</h2>
    <div class="space-y-2">
      <label class="text-xs text-slate-400">Masukkan NIS Siswa</label>
      <input type="number" id="input-nis" placeholder="Contoh: 1001" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 font-tech">
    </div>
    <button onclick="checkStudentData()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-tech font-bold py-3 rounded-xl shadow-lg shadow-cyan-950 transition">
      TAMPILKAN DATA
    </button>
  </div>

  <!-- DASHBOARD ORANG TUA (DITAMPILKAN SETELAH NIS DITEMUKAN) -->
  <div id="student-portal" class="w-full max-w-2xl hidden space-y-6">

    <!-- CARD INFORMASI SISWA -->
    <div class="cyber-card p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <!-- Profile Picture Container -->
        <div class="w-16 h-20 border border-cyan-400 rounded-lg bg-slate-900 flex items-center justify-center overflow-hidden shrink-0">
          <img id="parent-profile-photo" src="" class="w-full h-full object-cover hidden">
          <i id="parent-profile-placeholder" class="fa-solid fa-user text-slate-600 text-2xl"></i>
        </div>
        <div>
          <h3 id="parent-student-name" class="font-tech text-lg font-bold text-cyan-400">-</h3>
          <p class="text-xs text-slate-300">NIS: <span id="parent-student-nis" class="font-tech text-white">-</span></p>
          <p class="text-xs text-slate-400">Kelas: <span id="parent-student-kelas" class="text-white">-</span> | JK: <span id="parent-student-jk" class="text-white">-</span></p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap md:flex-col gap-2 w-full md:w-auto">
        <button onclick="openCardModal()" class="flex-1 md:flex-none bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-tech text-xs px-4 py-2.5 rounded-xl shadow transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-address-card"></i> Cetak Kartu
        </button>
        <button onclick="logoutPortal()" class="flex-1 md:flex-none bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs px-4 py-2 rounded-xl border border-slate-700 transition">
          Cari NIS Lain
        </button>
      </div>
    </div>

    <!-- TABEL RIWAYAT PRESENSI -->
    <div class="cyber-card rounded-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 bg-slate-900/60 flex justify-between items-center">
        <h3 class="font-tech text-xs font-bold text-cyan-400">RIWAYAT PRESENSI SISWA</h3>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-900/80 text-cyan-400 font-tech uppercase border-b border-slate-800">
            <tr>
              <th class="p-3">Tanggal</th>
              <th class="p-3">Waktu</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="tb-parent-history" class="divide-y divide-slate-800/50">
            <tr><td colspan="3" class="text-center p-4 text-slate-500">Memuat riwayat...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- MODAL KARTU PELAJAR POTRAIT & UPLOAD FOTO -->
  <div id="modal-card" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="cyber-card p-6 rounded-2xl max-w-sm w-full border border-cyan-500/30 space-y-4 text-center relative">
      <button onclick="closeCardModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <h3 class="font-tech text-cyan-400 font-bold text-sm">KARTU PELAJAR DIGITAL</h3>

      <!-- CONTAINER PRINT AREA KARTU POTRAIT -->
      <div class="flex justify-center">
        <div id="print-area">
          <div class="id-card-potrait">
            <!-- Header Logos & Title -->
            <div class="text-center space-y-1">
              <div class="flex justify-center items-center gap-1.5 border-b border-cyan-500/30 pb-1">
                <img src="logo-karawang.png" class="h-4 w-auto">
                <img src="logo-disdik.png" class="h-4 w-auto">
                <img src="logo-sekolah.png" class="h-4 w-auto">
              </div>
              <p class="font-tech text-[7px] text-cyan-400 tracking-tighter">KARTU PELAJAR | SDIT AL-IQRA TIRTAMULYA</p>
            </div>

            <!-- Foto Siswa -->
            <div class="flex justify-center my-1">
              <div class="w-16 h-20 border border-cyan-400 rounded bg-slate-900 flex items-center justify-center overflow-hidden">
                <img id="card-photo" src="" class="w-full h-full object-cover hidden">
                <i id="card-photo-placeholder" class="fa-solid fa-user text-slate-600 text-2xl"></i>
              </div>
            </div>

            <!-- Detail Data Siswa -->
            <div class="text-center space-y-0.5 text-[9px]">
              <p class="text-cyan-400 font-semibold uppercase leading-tight" id="card-name">-</p>
              <p class="text-slate-300 font-tech">NIS: <span id="card-nis">-</span></p>
              <p class="text-slate-400" id="card-jk">-</p>
            </div>

            <!-- QR Code Murni -->
            <div class="flex flex-col items-center mt-1">
              <div id="card-qrcode" class="bg-white p-1 rounded border border-cyan-400"></div>
              <p class="text-[6px] font-tech text-cyan-400 mt-1">SCAN UNTUK ABSENSI</p>
            </div>
          </div>
        </div>
      </div>

      <!-- FORM UPLOAD FOTO (BISA OLEH ORANG TUA JIKA BELUM DILENGKAPI) -->
      <div class="space-y-3 pt-2 border-t border-slate-800 text-left">
        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Unggah / Perbarui Foto Siswa (Pas foto resmi):</label>
          <input type="file" id="input-foto-parent" accept="image/*" onchange="previewParentPhoto(event)" class="text-xs text-slate-400 w-full file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-xs file:bg-slate-800 file:text-cyan-400 hover:file:bg-slate-700">
        </div>

        <div class="flex gap-2">
          <button onclick="saveParentPhoto()" class="flex-1 bg-cyan-800 hover:bg-cyan-700 text-white font-semibold text-xs py-2 rounded-lg transition">
            Simpan Foto
          </button>
          <button onclick="window.print()" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-tech font-bold text-xs py-2 rounded-lg transition">
            <i class="fa-solid fa-print"></i> Cetak Kartu
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxPDJzBTk8IDjIH6DnR00CVTkNmY3x5SmNmelyB0ZOpq6g8Lrn5HhKIOgvC3KzjAu7o/exec";
    let activeStudent = null;

    function checkStudentData() {
      const nis = document.getElementById('input-nis').value.trim();
      if (!nis) {
        alert("Masukkan NIS terlebih dahulu!");
        return;
      }

      fetch(`${GAS_API_URL}?action=getSiswa`)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            const student = res.data.find(s => s[0].toString() === nis);
            if (student) {
              activeStudent = student;
              renderParentPortal(student);
              loadStudentAttendanceHistory(nis);
            } else {
              alert("Data NIS tidak ditemukan!");
            }
          }
        });
    }

    function renderParentPortal(student) {
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('student-portal').classList.remove('hidden');

      const nis = student[0];
      const nama = student[1];
      const kelas = student[2];
      const jk = student[3] || 'Laki-Laki';
      const fotoUrl = student[5] || '';

      document.getElementById('parent-student-name').innerText = nama;
      document.getElementById('parent-student-nis').innerText = nis;
      document.getElementById('parent-student-kelas').innerText = kelas;
      document.getElementById('parent-student-jk').innerText = jk;

      const profileImg = document.getElementById('parent-profile-photo');
      const profilePlaceholder = document.getElementById('parent-profile-placeholder');

      if (fotoUrl) {
        profileImg.src = fotoUrl;
        profileImg.classList.remove('hidden');
        profilePlaceholder.classList.add('hidden');
      } else {
        profileImg.classList.add('hidden');
        profilePlaceholder.classList.remove('hidden');
      }
    }

    function loadStudentAttendanceHistory(nis) {
      fetch(`${GAS_API_URL}?action=getLaporan`)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            const history = res.data.filter(r => r[2].toString() === nis.toString());
            let html = '';
            
            history.reverse().forEach(r => {
              const dateFormatted = new Date(r[1]).toLocaleDateString('id-ID');
              const timeFormatted = new Date(r[0]).toLocaleTimeString('id-ID');
              html += `<tr class="hover:bg-slate-900/50">
                <td class="p-3">${dateFormatted}</td>
                <td class="p-3 font-tech text-cyan-400">${timeFormatted}</td>
                <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${r[5] === 'Hadir' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">${r[5]}</span></td>
              </tr>`;
            });

            document.getElementById('tb-parent-history').innerHTML = html || '<tr><td colspan="3" class="text-center p-4 text-slate-500">Belum ada catatan presensi.</td></tr>';
          }
        });
    }

    function openCardModal() {
      if (!activeStudent) return;

      const nis = activeStudent[0];
      const nama = activeStudent[1];
      const jk = activeStudent[3] || 'Laki-Laki';
      const fotoUrl = activeStudent[5] || '';

      document.getElementById('card-name').innerText = nama;
      document.getElementById('card-nis').innerText = nis;
      document.getElementById('card-jk').innerText = jk;

      const imgEl = document.getElementById('card-photo');
      const placeholderEl = document.getElementById('card-photo-placeholder');

      if (fotoUrl) {
        imgEl.src = fotoUrl;
        imgEl.classList.remove('hidden');
        placeholderEl.classList.add('hidden');
      } else {
        imgEl.classList.add('hidden');
        placeholderEl.classList.remove('hidden');
      }

      // Generate QR Code Murni (Ukuran 65x65 px)
      document.getElementById('card-qrcode').innerHTML = '';
      new QRCode(document.getElementById('card-qrcode'), {
        text: nis.toString(),
        width: 65,
        height: 65,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      document.getElementById('modal-card').classList.remove('hidden');
    }

    function closeCardModal() {
      document.getElementById('modal-card').classList.add('hidden');
    }

    function previewParentPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgEl = document.getElementById('card-photo');
          imgEl.src = e.target.result;
          imgEl.classList.remove('hidden');
          document.getElementById('card-photo-placeholder').classList.add('hidden');

          // Preview juga di profil portal
          const profileImg = document.getElementById('parent-profile-photo');
          profileImg.src = e.target.result;
          profileImg.classList.remove('hidden');
          document.getElementById('parent-profile-placeholder').classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function saveParentPhoto() {
      const imgEl = document.getElementById('card-photo');
      if (imgEl.classList.contains('hidden') || !imgEl.src) {
        alert("Pilih file foto terlebih dahulu!");
        return;
      }

      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "updateFotoSiswa",
          nis: activeStudent[0],
          fotoData: imgEl.src
        })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        if (res.status === 'success') {
          activeStudent[5] = imgEl.src; // Update local state
        }
      });
    }

    function logoutPortal() {
      activeStudent = null;
      document.getElementById('input-nis').value = '';
      document.getElementById('login-box').classList.remove('hidden');
      document.getElementById('student-portal').classList.add('hidden');
    }
  </script>
</body>
</html>
