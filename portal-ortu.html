<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Orang Tua - Cyber Attendance System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap');

    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #080c14;
      color: #e2e8f0;
    }

    .font-tech {
      font-family: 'Orbitron', sans-serif;
    }

    .cyber-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(6, 182, 212, 0.2);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.1);
    }

    .cyber-card:hover {
      border-color: rgba(6, 182, 212, 0.5);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
    }

    .neon-text-cyan {
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.7);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #080c14;
    }
    ::-webkit-scrollbar-thumb {
      background: #06b6d4;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

  <!-- NAVBAR -->
  <header class="p-4 border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <img src="logo-sekolah.png" alt="Logo" class="h-9 w-auto">
      <div>
        <h1 class="font-tech text-base font-bold text-cyan-400 neon-text-cyan">PORTAL ORANG TUA</h1>
        <p class="text-[10px] text-slate-400">Cyber Attendance Monitor</p>
      </div>
    </div>
    <div id="user-info" class="hidden flex items-center gap-3">
      <div class="text-right">
        <p id="student-name" class="text-sm font-bold text-white leading-tight"></p>
        <p id="student-class" class="text-xs text-cyan-400 font-tech"></p>
      </div>
      <button onclick="logout()" class="bg-rose-950/60 hover:bg-rose-900 border border-rose-800 text-rose-300 text-xs px-3 py-1.5 rounded-lg transition">
        <i class="fa-solid fa-right-from-bracket"></i> Keluar
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full">

    <!-- LOGIN SECTION -->
    <section id="login-section" class="max-w-md mx-auto my-12">
      <div class="cyber-card p-6 md:p-8 rounded-2xl border border-cyan-500/30 text-center space-y-6">
        <div class="inline-flex p-4 rounded-full bg-cyan-950/50 border border-cyan-500/30 text-cyan-400 text-3xl">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <div>
          <h2 class="font-tech text-xl font-bold text-white tracking-wide">MASUK PORTAL</h2>
          <p class="text-xs text-slate-400 mt-1">Masukkan Nomor Induk Siswa (NIS/NISN) anak Anda</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <input type="text" id="input-nis" placeholder="Masukkan NIS / NISN..." required
              class="w-full bg-slate-900 border border-slate-700 text-white text-center font-tech rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500 transition tracking-wider">
          </div>
          <button type="submit" id="btn-login" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-tech font-bold py-3 rounded-xl shadow-lg shadow-cyan-950 transition">
            VERIFIKASI SISWA
          </button>
        </form>
      </div>
    </section>

    <!-- DASHBOARD SECTION -->
    <section id="dashboard-section" class="hidden space-y-6">

      <!-- CARDS SUMMARY -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="cyber-card p-4 rounded-xl border-l-4 border-l-emerald-500">
          <p class="text-xs text-slate-400 font-semibold uppercase">Total Hadir</p>
          <h3 id="stat-hadir" class="text-2xl md:text-3xl font-tech font-bold text-emerald-400 mt-1">0</h3>
        </div>
        <div class="cyber-card p-4 rounded-xl border-l-4 border-l-amber-500">
          <p class="text-xs text-slate-400 font-semibold uppercase">Sakit</p>
          <h3 id="stat-sakit" class="text-2xl md:text-3xl font-tech font-bold text-amber-400 mt-1">0</h3>
        </div>
        <div class="cyber-card p-4 rounded-xl border-l-4 border-l-blue-500">
          <p class="text-xs text-slate-400 font-semibold uppercase">Izin</p>
          <h3 id="stat-izin" class="text-2xl md:text-3xl font-tech font-bold text-blue-400 mt-1">0</h3>
        </div>
        <div class="cyber-card p-4 rounded-xl border-l-4 border-l-rose-500">
          <p class="text-xs text-slate-400 font-semibold uppercase">Alpha</p>
          <h3 id="stat-alpha" class="text-2xl md:text-3xl font-tech font-bold text-rose-400 mt-1">0</h3>
        </div>
      </div>

      <!-- ACTION & FILTER BAR -->
      <div class="cyber-card p-4 rounded-xl flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-filter text-cyan-400 text-xs"></i>
          <label class="text-xs text-slate-400">Bulan:</label>
          <input type="month" id="filter-month" onchange="filterAttendanceLogs()" class="bg-slate-900 border border-slate-700 text-xs text-white rounded-lg p-2 focus:border-cyan-500">
        </div>
        
        <button onclick="openPermissionModal()" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold text-xs px-4 py-2.5 rounded-lg transition flex items-center gap-2">
          <i class="fa-solid fa-envelope-open-text"></i> Ajukan Surat Izin/Sakit
        </button>
      </div>

      <!-- TABLE HISTORY -->
      <div class="cyber-card rounded-xl overflow-hidden">
        <div class="p-4 border-b border-slate-800/80 bg-slate-900/40">
          <h3 class="font-tech text-cyan-400 font-bold text-sm">RIWAYAT PRESENSI</h3>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-900/80 text-cyan-400 font-tech uppercase text-xs border-b border-slate-800">
              <tr>
                <th class="p-4">Tanggal</th>
                <th class="p-4">Waktu</th>
                <th class="p-4">Status</th>
              </tr>
            </thead>
            <tbody id="tb-history" class="divide-y divide-slate-800/50">
              <tr><td colspan="3" class="text-center p-4 text-slate-500">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </section>

  </main>

  <!-- MODAL AJUKAN IZIN -->
  <div id="modal-izin" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="cyber-card p-6 rounded-2xl max-w-md w-full border border-cyan-500/30 space-y-4 relative">
      <button onclick="closePermissionModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      
      <h3 class="font-tech text-cyan-400 font-bold text-lg">FORM PENGAJUAN IZIN/SAKIT</h3>
      
      <form onsubmit="submitPermission(event)" class="space-y-3">
        <div>
          <label class="text-xs text-slate-400">Jenis Permohonan</label>
          <select id="perm-type" required class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg p-2.5 text-sm mt-1 focus:border-cyan-500">
            <option value="Izin">Izin</option>
            <option value="Sakit">Sakit</option>
          </select>
        </div>

        <div>
          <label class="text-xs text-slate-400">Keterangan / Alasan</label>
          <textarea id="perm-reason" required rows="3" placeholder="Contoh: Sakit demam / Acara keluarga..." class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg p-2.5 text-sm mt-1 focus:border-cyan-500"></textarea>
        </div>

        <button type="submit" id="btn-submit-perm" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-tech font-bold py-2.5 rounded-lg transition">
          KIRIM PENGAJUAN
        </button>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="p-4 border-t border-slate-800/80 bg-slate-950/40 text-center text-xs text-slate-500">
    <p>&copy; 2026 Cyber Attendance System. All rights reserved.</p>
  </footer>

  <script>
    // URL Deployment Web App Google Apps Script Anda
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxPDJzBTk8IDjIH6DnR00CVTkNmY3x5SmNmelyB0ZOpq6g8Lrn5HhKIOgvC3KzjAu7o/exec";

    let currentStudent = null;
    let rawAttendanceLogs = [];

    // Verifikasi NIS / Login
    function handleLogin(e) {
      e.preventDefault();
      const nisInput = document.getElementById('input-nis').value.trim();
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerText = "MEMERIKSA DATA...";

      fetch(`${GAS_API_URL}?action=getSiswa`)
        .then(res => res.json())
        .then(res => {
          btn.disabled = false;
          btn.innerText = "VERIFIKASI SISWA";

          if (res.status === 'success') {
            // Mencari siswa berdasarkan NIS (index 0 di Google Sheets)
            const found = res.data.find(s => s[0].toString() === nisInput);
            if (found) {
              currentStudent = { nis: found[0], nama: found[1], kelas: found[2], noHp: found[4] };
              showPortal();
            } else {
              alert("Data NIS / NISN tidak ditemukan! Periksa kembali nomor yang Anda masukkan.");
            }
          }
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerText = "VERIFIKASI SISWA";
          alert("Gagal terhubung ke server. Pastikan URL Google Apps Script sudah benar.");
        });
    }

    // Tampilkan Antarmuka Setelah Login
    function showPortal() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      document.getElementById('user-info').classList.remove('hidden');

      document.getElementById('student-name').innerText = currentStudent.nama;
      document.getElementById('student-class').innerText = `Kelas: ${currentStudent.kelas} (${currentStudent.nis})`;

      loadStudentAttendance();
    }

    // Keluar (Logout)
    function logout() {
      currentStudent = null;
      rawAttendanceLogs = [];
      document.getElementById('login-section').classList.remove('hidden');
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('user-info').classList.add('hidden');
      document.getElementById('input-nis').value = '';
    }

    // Fetch Riwayat Absensi Siswa
    function loadStudentAttendance() {
      fetch(`${GAS_API_URL}?action=getLaporan`)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            // Filter hanya log milik NIS yang sedang login
            rawAttendanceLogs = res.data.filter(r => r[2].toString() === currentStudent.nis.toString());
            updateDashboardStats(rawAttendanceLogs);
            renderAttendanceTable(rawAttendanceLogs);
          }
        });
    }

    // Kalkulasi Rekapitulasi Status Presensi
    function updateDashboardStats(logs) {
      let hadir = 0, sakit = 0, izin = 0, alpha = 0;
      
      logs.forEach(r => {
        const st = r[5];
        if (st === 'Hadir') hadir++;
        else if (st === 'Sakit') sakit++;
        else if (st === 'Izin') izin++;
        else if (st === 'Alpha') alpha++;
      });

      document.getElementById('stat-hadir').innerText = hadir;
      document.getElementById('stat-sakit').innerText = sakit;
      document.getElementById('stat-izin').innerText = izin;
      document.getElementById('stat-alpha').innerText = alpha;
    }

    // Render Tabel Riwayat
    function renderAttendanceTable(logs) {
      let html = '';
      logs.slice().reverse().forEach(r => {
        const dateFormatted = new Date(r[1]).toLocaleDateString('id-ID', {
          weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
        });
        const timeFormatted = new Date(r[0]).toLocaleTimeString('id-ID');
        
        let badgeStyle = 'bg-slate-800 text-slate-300';
        if (r[5] === 'Hadir') badgeStyle = 'bg-emerald-950 text-emerald-400 border border-emerald-800';
        else if (r[5] === 'Sakit') badgeStyle = 'bg-amber-950 text-amber-400 border border-amber-800';
        else if (r[5] === 'Izin') badgeStyle = 'bg-blue-950 text-blue-400 border border-blue-800';
        else if (r[5] === 'Alpha') badgeStyle = 'bg-rose-950 text-rose-400 border border-rose-800';

        html += `<tr class="hover:bg-slate-900/50">
          <td class="p-4 font-semibold text-white">${dateFormatted}</td>
          <td class="p-4 text-cyan-400 font-tech">${timeFormatted}</td>
          <td class="p-4"><span class="px-2.5 py-1 rounded-md text-xs font-bold ${badgeStyle}">${r[5]}</span></td>
        </tr>`;
      });

      document.getElementById('tb-history').innerHTML = html || '<tr><td colspan="3" class="text-center p-4 text-slate-500">Belum ada data presensi.</td></tr>';
    }

    // Filter Riwayat Berdasarkan Bulan
    function filterAttendanceLogs() {
      const selectedMonth = document.getElementById('filter-month').value; // Format: YYYY-MM
      if (!selectedMonth) {
        renderAttendanceTable(rawAttendanceLogs);
        return;
      }

      const filtered = rawAttendanceLogs.filter(r => {
        const logDate = new Date(r[1]);
        const yearMonth = logDate.toISOString().slice(0, 7);
        return yearMonth === selectedMonth;
      });

      renderAttendanceTable(filtered);
    }

    // Modal Operations
    function openPermissionModal() {
      document.getElementById('modal-izin').classList.remove('hidden');
    }

    function closePermissionModal() {
      document.getElementById('modal-izin').classList.add('hidden');
    }

    // Submit Permohonan Izin / Sakit ke Web App GAS
    function submitPermission(e) {
      e.preventDefault();
      const status = document.getElementById('perm-type').value;
      const reason = document.getElementById('perm-reason').value;
      const btn = document.getElementById('btn-submit-perm');

      btn.disabled = true;
      btn.innerText = "MENGIRIM...";

      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "submitAbsen",
          nisn: currentStudent.nis,
          status: `${status} (${reason})`
        })
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerText = "KIRIM PENGAJUAN";
        alert(res.message);
        if (res.status === 'success') {
          closePermissionModal();
          loadStudentAttendance();
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerText = "KIRIM PENGAJUAN";
        alert("Gagal mengajukan izin!");
      });
    }
  </script>
</body>
</html>
