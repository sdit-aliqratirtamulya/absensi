<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Orang Tua - Cyber School</title>
  <!-- Tailwind CSS via CDN Terkompilasi -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- Section 1: Modal Login -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900 bg-opacity-70 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-5">
      <div class="text-center space-y-2">
        <img src="logo.png" alt="Logo Sekolah" class="h-12 mx-auto object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/50?text=Logo';">
        <h2 class="text-xl font-bold text-gray-800">Portal Orang Tua / Wali</h2>
        <p class="text-xs text-gray-500">Masukkan NIS siswa untuk melihat data presensi & kartu pelajar.</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nomor Induk Siswa (NIS)</label>
          <input type="text" id="loginNis" placeholder="Contoh: 1001" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>

        <div id="loginError" class="hidden text-xs text-rose-600 bg-rose-50 p-2.5 rounded-lg border border-rose-200"></div>

        <button type="submit" id="btnLogin" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk Portal
        </button>
      </form>
    </div>
  </div>

  <!-- Section 2: Header Utama -->
  <header class="bg-white border-b border-slate-200 no-print sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <!-- Logo Repositori Lokal -->
        <img src="logo.png" alt="Logo Sekolah" class="h-9 w-auto object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/40?text=Logo';">
        <span class="font-bold text-lg text-gray-800 hidden sm:inline">Cyber School</span>
      </div>
      <div id="userInfo" class="hidden flex items-center gap-3">
        <div class="text-right">
          <p id="userNama" class="text-xs font-bold text-gray-800"></p>
          <p id="userKelas" class="text-xs text-gray-500"></p>
        </div>
        <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar
        </button>
      </div>
    </div>
  </header>

  <!-- Section 3: Body Content (Siswa Dashboard) -->
  <main id="portalContent" class="hidden max-w-5xl mx-auto px-4 py-6 space-y-6">

    <!-- Kartu Pelajar Digital Area -->
    <section class="bg-gradient-to-r from-sky-600 to-indigo-700 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-6 relative z-10">
        
        <div class="flex items-center gap-4">
          <!-- ELEMEN QR CODE SISWA (Menggantikan Foto Siswa) -->
          <div class="w-24 h-24 bg-white p-1.5 rounded-xl shadow-inner flex items-center justify-center shrink-0">
            <img id="cardFoto" src="" alt="QR Code NIS" class="w-full h-full object-contain">
          </div>
          <div>
            <span class="bg-sky-400 bg-opacity-30 text-sky-100 text-xs px-2.5 py-0.5 rounded-full font-medium">Kartu Pelajar Digital</span>
            <h2 id="cardNama" class="text-xl font-bold mt-1">-</h2>
            <p class="text-xs text-sky-100 mt-0.5">NIS: <span id="cardNis" class="font-semibold">-</span> | Kelas: <span id="cardKelas" class="font-semibold">-</span></p>
          </div>
        </div>

        <button onclick="cetakKartu()" class="no-print bg-white text-sky-700 hover:bg-sky-50 font-semibold px-4 py-2 rounded-xl text-xs shadow-md transition flex items-center gap-2">
          <i class="fa-solid fa-print"></i> Cetak Kartu
        </button>

      </div>
    </section>

    <!-- Tab Navigation -->
    <div class="no-print flex border-b border-slate-200 gap-4 text-sm font-semibold">
      <button onclick="switchTab('presensi')" id="tabBtnPresensi" class="pb-2 border-b-2 border-sky-600 text-sky-600">
        <i class="fa-solid fa-calendar-check mr-1"></i> Riwayat Presensi
      </button>
      <button onclick="switchTab('izin')" id="tabBtnIzin" class="pb-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700">
        <i class="fa-solid fa-file-signature mr-1"></i> Pengajuan Izin / Sakit
      </button>
    </div>

    <!-- Tab 1: Tabel Riwayat Presensi -->
    <section id="tabPresensi" class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
      <h3 class="font-bold text-gray-800 text-sm mb-4">Catatan Kehadiran Siswa</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="bg-slate-50 text-slate-600 text-xs uppercase font-semibold">
              <th class="p-3">Waktu</th>
              <th class="p-3">Tanggal</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="tableRiwayatBody" class="divide-y divide-slate-100 text-xs">
            <tr><td colspan="3" class="text-center py-4 text-gray-400">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Tab 2: Form Pengajuan Izin/Sakit -->
    <section id="tabIzin" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-5 max-w-2xl">
      <h3 class="font-bold text-gray-800 text-sm mb-4">Form Formulir Izin / Sakit</h3>
      <form onsubmit="handlePengajuanIzin(event)" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Kategori</label>
            <select id="izinKategori" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-sky-500">
              <option value="Izin">Izin</option>
              <option value="Sakit">Sakit</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Tanggal Mulai</label>
            <input type="date" id="izinMulai" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-sky-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Tanggal Selesai</label>
            <input type="date" id="izinSelesai" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-sky-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Upload Bukti (Surat Dokter/Lampiran)</label>
            <input type="file" id="izinFile" accept="image/*,application/pdf" class="w-full text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-sky-50 file:text-sky-700">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Alasan</label>
          <textarea id="izinAlasan" rows="3" required placeholder="Tuliskan keterangan/alasan lengkap..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-sky-500"></textarea>
        </div>

        <button type="submit" id="btnSubmitIzin" class="bg-sky-600 hover:bg-sky-700 text-white font-medium px-5 py-2 rounded-lg text-xs transition flex items-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> Kirim Pengajuan
        </button>
      </form>
    </section>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTlhNqnCvbhXW2IcpnXParAykCx8z4-_oBiwp9FZn8ygUD0VBC5xj-MK3U6k3hGGOw/exec";
    let activeSiswa = null;

    // Login Handler
    function handleLogin(e) {
      e.preventDefault();
      const nis = document.getElementById('loginNis').value.trim();
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('btnLogin');

      errorEl.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...`;

      fetch(`${SCRIPT_URL}?action=getSiswa&nis=${encodeURIComponent(nis)}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success' && res.siswa) {
            activeSiswa = res.siswa;
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('portalContent').classList.remove('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            
            // Set User Topbar
            document.getElementById('userNama').textContent = activeSiswa.nama;
            document.getElementById('userKelas').textContent = activeSiswa.kelas;

            // Set Kartu Pelajar
            updateKartuPelajar(activeSiswa.nama, activeSiswa.nis, activeSiswa.kelas);
            loadRiwayatPresensi(activeSiswa.nis);
          } else {
            errorEl.textContent = "NIS tidak ditemukan atau belum terdaftar!";
            errorEl.classList.remove('hidden');
          }
        })
        .catch(err => {
          errorEl.textContent = "Gagal terhubung ke server. Periksa koneksi/CORS Apps Script.";
          errorEl.classList.remove('hidden');
        })
        .finally(() => {
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Masuk Portal`;
        });
    }

    // Set QR Code pada Kartu Pelajar Digital
    function updateKartuPelajar(nama, nis, kelas) {
      document.getElementById('cardNama').textContent = nama;
      document.getElementById('cardNis').textContent = nis;
      document.getElementById('cardKelas').textContent = kelas;

      // QR Code NIS via Google Charts API
      const qrImg = document.getElementById('cardFoto');
      qrImg.src = `https://chart.googleapis.com/chart?cht=qr&chs=200x200&chl=${encodeURIComponent(nis)}`;
      qrImg.onerror = function() {
        this.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='10' fill='%23666'>QR Error</text></svg>";
      };
    }

    // Load Data Presensi Siswa
    function loadRiwayatPresensi(nis) {
      const tbody = document.getElementById('tableRiwayatBody');
      tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-gray-400">Memuat data...</td></tr>`;

      fetch(`${SCRIPT_URL}?action=getLaporan&nis=${encodeURIComponent(nis)}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success' && res.data.length > 0) {
            tbody.innerHTML = '';
            res.data.reverse().forEach(row => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td class="p-3 font-mono">${row[0]}</td>
                <td class="p-3">${row[1]}</td>
                <td class="p-3"><span class="px-2 py-0.5 rounded-full font-semibold ${getStatusBadge(row[5])}">${row[5]}</span></td>
              `;
              tbody.appendChild(tr);
            });
          } else {
            tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-gray-400">Belum ada riwayat presensi.</td></tr>`;
          }
        });
    }

    // Tab Switcher
    function switchTab(tab) {
      if (tab === 'presensi') {
        document.getElementById('tabPresensi').classList.remove('hidden');
        document.getElementById('tabIzin').classList.add('hidden');
        document.getElementById('tabBtnPresensi').className = "pb-2 border-b-2 border-sky-600 text-sky-600";
        document.getElementById('tabBtnIzin').className = "pb-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700";
      } else {
        document.getElementById('tabPresensi').classList.add('hidden');
        document.getElementById('tabIzin').classList.remove('hidden');
        document.getElementById('tabBtnIzin').className = "pb-2 border-b-2 border-sky-600 text-sky-600";
        document.getElementById('tabBtnPresensi').className = "pb-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700";
      }
    }

    // Handle Pengajuan Izin
    function handlePengajuanIzin(e) {
      e.preventDefault();
      if (!activeSiswa) return;

      const btn = document.getElementById('btnSubmitIzin');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...`;

      const fileInput = document.getElementById('izinFile');
      let fileData = null, fileName = null, fileType = null;

      const submitData = () => {
        const payload = {
          action: 'submitIzinSakit',
          nis: activeSiswa.nis,
          namaSiswa: activeSiswa.nama,
          kategori: document.getElementById('izinKategori').value,
          tglMulai: document.getElementById('izinMulai').value,
          tglSelesai: document.getElementById('izinSelesai').value,
          alasan: document.getElementById('izinAlasan').value,
          fileData, fileName, fileType
        };

        fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
          alert('Pengajuan Izin/Sakit Berhasil Dikirim!');
          e.target.reset();
          switchTab('presensi');
        })
        .catch(err => alert('Gagal mengirim pengajuan.'))
        .finally(() => {
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Kirim Pengajuan`;
        });
      };

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
          fileData = evt.target.result.split(',')[1];
          fileName = file.name;
          fileType = file.type;
          submitData();
        };
        reader.readAsDataURL(file);
      } else {
        submitData();
      }
    }

    function getStatusBadge(status) {
      switch (status) {
        case 'Hadir': return 'bg-emerald-100 text-emerald-800';
        case 'Izin': return 'bg-amber-100 text-amber-800';
        case 'Sakit': return 'bg-sky-100 text-sky-800';
        default: return 'bg-rose-100 text-rose-800';
      }
    }

    function cetakKartu() { window.print(); }
    function logout() { location.reload(); }
  </script>
</body>
</html>
