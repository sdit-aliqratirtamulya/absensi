<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Presensi Siswa</title>
  <!-- Tailwind CSS via CDN Terkompilasi (Stabil untuk Produksi) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

  <!-- Header Section -->
  <header class="bg-sky-600 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <!-- Logo Lokal Repositori -->
        <img src="logo.png" alt="Logo Sekolah" class="h-10 w-auto object-contain bg-white rounded-md p-1" onerror="this.onerror=null; this.src='https://via.placeholder.com/40?text=Logo';">
        <div>
          <h1 class="font-bold text-lg leading-tight">Presensi Kehadiran Siswa</h1>
          <p class="text-xs text-sky-100">Cyber Attendance System</p>
        </div>
      </div>
      <div id="clock" class="text-right font-mono font-bold text-sm md:text-base bg-sky-700 px-3 py-1 rounded-lg">
        00:00:00 WIB
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-12 gap-6">
    
    <!-- Left Column: Camera Scanner & Input Manual -->
    <section class="md:col-span-5 space-y-6">
      
      <!-- Card Scanner -->
      <div class="bg-white p-5 rounded-xl shadow-md border border-slate-200">
        <h2 class="font-bold text-gray-800 text-base mb-3 flex items-center gap-2">
          <i class="fa-solid fa-qrcode text-sky-600"></i> Scan QR Code NIS
        </h2>
        
        <div id="reader" class="w-full bg-slate-900 rounded-lg overflow-hidden border-2 border-sky-500"></div>
        
        <div class="mt-4 flex gap-2">
          <button id="btnStartScan" onclick="startScanner()" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-medium py-2 px-3 rounded-lg text-sm flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-camera"></i> Buka Kamera
          </button>
          <button id="btnStopScan" onclick="stopScanner()" class="hidden flex-1 bg-rose-600 hover:bg-rose-700 text-white font-medium py-2 px-3 rounded-lg text-sm flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-stop"></i> Tutup Kamera
          </button>
        </div>
      </div>

      <!-- Card Input Manual -->
      <div class="bg-white p-5 rounded-xl shadow-md border border-slate-200">
        <h2 class="font-bold text-gray-800 text-base mb-3 flex items-center gap-2">
          <i class="fa-solid fa-keyboard text-sky-600"></i> Input Manual NIS
        </h2>
        
        <form onsubmit="handleManualSubmit(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Nomor Induk Siswa (NIS)</label>
            <input type="text" id="manualNis" placeholder="Masukkan NIS Siswa" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Status Kehadiran</label>
            <select id="manualStatus" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="Hadir">Hadir</option>
              <option value="Izin">Izin</option>
              <option value="Sakit">Sakit</option>
              <option value="Alpa">Alpa</option>
            </select>
          </div>
          <button type="submit" id="btnSubmitManual" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 rounded-lg text-sm transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> Catat Presensi
          </button>
        </form>
      </div>

    </section>

    <!-- Right Column: Alert & Live Attendance Feed -->
    <section class="md:col-span-7 space-y-6">
      
      <!-- Status Feedback Alert -->
      <div id="statusAlert" class="hidden p-4 rounded-xl border flex items-start gap-3 transition-all duration-300">
        <i id="alertIcon" class="fa-solid text-xl mt-0.5"></i>
        <div>
          <h3 id="alertTitle" class="font-bold text-sm"></h3>
          <p id="alertBody" class="text-xs mt-1"></p>
        </div>
      </div>

      <!-- Live Feed Tabel Presensi -->
      <div class="bg-white p-5 rounded-xl shadow-md border border-slate-200">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-gray-800 text-base flex items-center gap-2">
            <i class="fa-solid fa-list-check text-sky-600"></i> Log Presensi Hari Ini
          </h2>
          <span id="logCount" class="text-xs font-semibold bg-sky-100 text-sky-800 px-2.5 py-1 rounded-full">0 Data</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-slate-100 text-slate-700 text-xs uppercase font-semibold">
                <th class="p-3 rounded-l-lg">Waktu</th>
                <th class="p-3">NIS</th>
                <th class="p-3">Nama</th>
                <th class="p-3">Kelas</th>
                <th class="p-3 rounded-r-lg">Status</th>
              </tr>
            </thead>
            <tbody id="presensiTableBody" class="divide-y divide-slate-100">
              <tr>
                <td colspan="5" class="text-center py-6 text-gray-400 text-xs">Belum ada data presensi yang masuk.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </section>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTlhNqnCvbhXW2IcpnXParAykCx8z4-_oBiwp9FZn8ygUD0VBC5xj-MK3U6k3hGGOw/exec";
    let html5QrcodeScanner = null;
    let isProcessing = false;

    // Jam Realtime
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID') + ' WIB';
    }, 1000);

    // QR Code Scanner Controls
    function startScanner() {
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScanSuccess
      ).then(() => {
        document.getElementById('btnStartScan').classList.add('hidden');
        document.getElementById('btnStopScan').classList.remove('hidden');
      }).catch(err => {
        showAlert('error', 'Gagal Akses Kamera', 'Pastikan izin kamera diizinkan oleh browser.');
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('btnStartScan').classList.remove('hidden');
          document.getElementById('btnStopScan').classList.add('hidden');
        });
      }
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      processPresensi(decodedText, 'Hadir');
      setTimeout(() => { isProcessing = false; }, 3000); // Debounce 3 detik
    }

    function handleManualSubmit(e) {
      e.preventDefault();
      const nis = document.getElementById('manualNis').value.trim();
      const status = document.getElementById('manualStatus').value;
      if (nis) {
        processPresensi(nis, status);
        document.getElementById('manualNis').value = '';
      }
    }

    // Kirim Data Presensi ke GAS
    function processPresensi(nis, status) {
      showAlert('info', 'Memproses...', 'Mengirim data presensi ke server...');

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'submitPresensi',
          nis: nis,
          status: status
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          showAlert('success', 'Presensi Berhasil!', `${res.siswa.nama} (${res.siswa.kelas}) - Status: ${res.statusPresensi}`);
          addLogToTable(res.waktu, res.siswa.nis, res.siswa.nama, res.siswa.kelas, res.statusPresensi);
        } else {
          showAlert('error', 'Presensi Gagal', res.message || 'NIS tidak ditemukan.');
        }
      })
      .catch(err => {
        showAlert('error', 'Koneksi Server Gagal', 'Gagal memuat data. Periksa pengaturan CORS/Internet Anda.');
      });
    }

    // Tampilkan Alert Feedback
    function showAlert(type, title, body) {
      const el = document.getElementById('statusAlert');
      const icon = document.getElementById('alertIcon');
      const titleEl = document.getElementById('alertTitle');
      const bodyEl = document.getElementById('alertBody');

      el.className = "p-4 rounded-xl border flex items-start gap-3 transition-all duration-300 ";
      
      if (type === 'success') {
        el.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-800');
        icon.className = 'fa-solid fa-circle-check text-emerald-600 text-xl';
      } else if (type === 'error') {
        el.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-800');
        icon.className = 'fa-solid fa-circle-xmark text-rose-600 text-xl';
      } else {
        el.classList.add('bg-sky-50', 'border-sky-200', 'text-sky-800');
        icon.className = 'fa-solid fa-spinner fa-spin text-sky-600 text-xl';
      }

      titleEl.textContent = title;
      bodyEl.textContent = body;
      el.classList.remove('hidden');
    }

    // Tambah Baris Log ke Tabel Front-end
    let logCounter = 0;
    function addLogToTable(waktu, nis, nama, kelas, status) {
      const tbody = document.getElementById('presensiTableBody');
      if (logCounter === 0) tbody.innerHTML = ''; // bersihkan pesan awal

      const row = document.createElement('tr');
      row.className = 'hover:bg-slate-50 transition text-gray-700';
      row.innerHTML = `
        <td class="p-3 font-mono text-xs">${waktu}</td>
        <td class="p-3 font-semibold">${nis}</td>
        <td class="p-3">${nama}</td>
        <td class="p-3 text-xs text-gray-500">${kelas}</td>
        <td class="p-3">
          <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full ${getStatusBadge(status)}">${status}</span>
        </td>
      `;
      tbody.prepend(row);
      logCounter++;
      document.getElementById('logCount').textContent = `${logCounter} Data`;
    }

    function getStatusBadge(status) {
      switch (status) {
        case 'Hadir': return 'bg-emerald-100 text-emerald-800';
        case 'Izin': return 'bg-amber-100 text-amber-800';
        case 'Sakit': return 'bg-sky-100 text-sky-800';
        default: return 'bg-rose-100 text-rose-800';
      }
    }
  </script>
</body>
</html>
